name: Deploy QA (VPS)

# Ambiente de QA: https://qa.storyverse.2.29.42.104.sslip.io (API: api.qa…). Dados de teste.
# Push no branch `develop` (integração/próxima release) publica sozinho. Para testar uma branch
# antes do merge, escolha o ref à mão:
#   gh workflow run deploy-qa.yml -f ref=feat/minha-branch
# Manual: docs/QA.md.
#
# O código do branch (npm ci/test/build) roda no job `build`, que não tem segredo nenhum. Só o job
# `deploy` recebe a chave da VPS, e ele não faz checkout: baixa o site pronto e publica.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit para publicar no QA
        required: true
        default: main
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Definir a release (commit publicado)
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar
        run: npm test

      - name: Montar o site de QA (build)
        env:
          VITE_API_URL: https://api.qa.storyverse.2.29.42.104.sslip.io
          VITE_APP_ENV: qa
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_QA }}
          VITE_SENTRY_ENVIRONMENT: qa
          VITE_SENTRY_RELEASE: ${{ steps.release.outputs.sha }}
        run: npm run build

      - name: Guardar o site pronto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-qa
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site pronto
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-qa
          path: dist/

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "Configure VPS_KNOWN_HOSTS com a chave verificada da VPS"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Conferir que a VPS tem o publish.sh com suporte a QA
        run: |
          # O publish.sh antigo ignora as variáveis de QA e mexeria no site de produção.
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'grep -q STORYVERSE_WEB_DIR /home/deploy/storyverse/deploy/publish.sh' \
            || { echo "::error::publish.sh da VPS não suporta QA; atualize-o antes (docs/QA.md)."; exit 1; }

      - name: Enviar o build para a VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/deploy/storyverse/_incoming-qa/"

      - name: Publicar no QA (troca a versão e confere)
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'STORYVERSE_WEB_DIR=/home/deploy/storyverse/web/qa STORYVERSE_INCOMING=/home/deploy/storyverse/_incoming-qa STORYVERSE_URL=https://qa.storyverse.2.29.42.104.sslip.io bash /home/deploy/storyverse/deploy/publish.sh'
