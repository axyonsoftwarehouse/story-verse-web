name: Story Magic API

on:
  push:
    paths:
      - "story-magic-api/**"
      - ".github/workflows/story-magic-api.yml"
  pull_request:
    paths:
      - "story-magic-api/**"
      - ".github/workflows/story-magic-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: story-magic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
      - name: Build production container
        run: docker build --tag story-magic-api:ci .
