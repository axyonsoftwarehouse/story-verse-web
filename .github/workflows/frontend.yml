name: Frontend

on:
  push:
    paths-ignore:
      - "story-magic-api/**"
      - ".github/workflows/story-magic-api.yml"
  pull_request:
    paths-ignore:
      - "story-magic-api/**"
      - ".github/workflows/story-magic-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
