name: Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

# Projeto "story-magic" na Vercel (time da Codeplus): os deploys saem daqui pela Vercel CLI,
# sem a Vercel precisar estar ligada a este repositório. Basta o segredo VERCEL_TOKEN.
env:
  VERCEL_ORG_ID: team_Sh216UlOrPQouVny8mVfAp7G
  VERCEL_PROJECT_ID: prj_a4sn6Oe2d08w4IhEJc9DLq6Frfz0
  STORYVERSE_API_URL: https://api.storyverse.2.29.42.104.sslip.io

# PENDENTE: o painel da Vercel ainda tem VITE_GROQ_API_KEY/VITE_GEMINI_API_KEY/
# VITE_OPENROUTER_API_KEY e não tem VITE_API_URL no Preview. Enquanto não houver acesso
# ao painel, os deploys abaixo limpam essas chaves do build e definem VITE_API_URL.
# Remover esse ajuste quando as variáveis da Vercel estiverem corretas.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        env:
          VITE_API_URL: https://api.storyverse.2.29.42.104.sslip.io
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: test
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Gerar SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom-web.cdx.json

      - name: Publicar SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom-web.cdx.json

  # Push na main: produção (só depois de lint, testes e build passarem).
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Segredo VERCEL_TOKEN não configurado: deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Deploy to production
        id: deploy
        if: steps.token.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          npm install --global vercel@65.0.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          for envfile in .vercel/.env.*.local; do
            [ -e "$envfile" ] || continue
            sed -i -E '/^VITE_(GROQ|GEMINI|OPENROUTER)_/d; /^VITE_SUPABASE_/d' "$envfile"
            sed -i '/^VITE_API_URL=/d; /^VITE_SENTRY_/d' "$envfile"
            printf 'VITE_API_URL=%s\n' "$STORYVERSE_API_URL" >> "$envfile"
            printf 'VITE_SENTRY_DSN=%s\n' "$SENTRY_DSN" >> "$envfile"
            printf 'VITE_SENTRY_ENVIRONMENT=production\n' >> "$envfile"
            printf 'VITE_SENTRY_RELEASE=%s\n' "$GITHUB_SHA" >> "$envfile"
          done
          echo "::warning::Chaves VITE_* de IA e Supabase removidas do build. Remova-as do painel da Vercel (pendente)."
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Produção: $url" >> "$GITHUB_STEP_SUMMARY"

  # Push na staging: ambiente de QA. Usa o ambiente "staging" da Vercel (variáveis e domínio
  # próprios); se ele não existir no projeto, cai para um Preview com as variáveis da branch staging.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Segredo VERCEL_TOKEN não configurado: deploy de QA pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Deploy QA (staging)
        id: deploy
        if: steps.token.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@65.0.0
          if vercel pull --yes --environment=staging --token="$VERCEL_TOKEN"; then
            target=staging
          else
            echo "::notice::Sem ambiente 'staging' na Vercel: usando Preview com as variáveis da branch staging."
            vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"
            target=preview
          fi
          for envfile in .vercel/.env.*.local; do
            [ -e "$envfile" ] || continue
            sed -i -E '/^VITE_(GROQ|GEMINI|OPENROUTER)_/d; /^VITE_SUPABASE_/d' "$envfile"
            sed -i '/^VITE_API_URL=/d' "$envfile"
            printf 'VITE_API_URL=%s\n' "$STORYVERSE_API_URL" >> "$envfile"
          done
          echo "::warning::Chaves VITE_* de IA e Supabase removidas do build. Remova-as do painel da Vercel (pendente)."
          if [ "$target" = "staging" ]; then
            vercel build --target=staging --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --target=staging --token="$VERCEL_TOKEN")
          else
            vercel build --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "QA (staging): $url" >> "$GITHUB_STEP_SUMMARY"

  # Pull request: preview, com o link comentado no PR (atualiza o mesmo comentário).
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Segredo VERCEL_TOKEN não configurado: preview pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Deploy preview
        id: deploy
        if: steps.token.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@65.0.0
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          for envfile in .vercel/.env.*.local; do
            [ -e "$envfile" ] || continue
            sed -i -E '/^VITE_(GROQ|GEMINI|OPENROUTER)_/d; /^VITE_SUPABASE_/d' "$envfile"
            sed -i '/^VITE_API_URL=/d' "$envfile"
            printf 'VITE_API_URL=%s\n' "$STORYVERSE_API_URL" >> "$envfile"
          done
          echo "::warning::Chaves VITE_* de IA e Supabase removidas do build. Remova-as do painel da Vercel (pendente)."
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL
        if: steps.token.outputs.ok == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n🔍 **Preview:** ${process.env.PREVIEW_URL}\n\nCommit ${context.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
