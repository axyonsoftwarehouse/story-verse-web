name: Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

# Só verificação (auditoria, lint, testes, build e SBOM). O deploy do site é na VPS, pelo
# workflow deploy-storyverse.yml; a Vercel não é mais usada.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        env:
          VITE_API_URL: https://api.storyverse.2.29.42.104.sslip.io
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: test
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Gerar SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom-web.cdx.json

      - name: Publicar SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom-web.cdx.json
