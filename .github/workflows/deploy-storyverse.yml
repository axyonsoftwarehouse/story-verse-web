name: Deploy Storyverse (VPS)

# Produção do Storyverse: todo push na `main` publica na VPS, que é o único
# endereço público do app (os domínios na Vercel ficam atrás do Deployment
# Protection: abrem a tela de login da Vercel para quem é de fora).
# O disparo automático era a branch `vps`, apagada em 17/10/2026; sem ela todo
# deploy virava manual (`workflow_dispatch`) e nenhum merge publicava.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: deploy-storyverse
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Produção é sempre a `main`, inclusive quando o workflow é disparado à mão
      # com o branch padrão em `develop`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      - name: Testar
        run: npm test

      - name: Montar o site (build)
        env:
          # A VPS usa a API própria; nunca apontar uma publicação para loopback.
          VITE_API_URL: https://api.storyverse.2.29.42.104.sslip.io
          VITE_LOGIN_REQUIRED: ${{ secrets.VITE_LOGIN_REQUIRED }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          # Site de produção no Umami (o id é público; o tracker vem de /u/* pelo Caddy).
          VITE_UMAMI_WEBSITE_ID: ac235b63-f338-4740-bd83-b29b5373f719
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "Configure VPS_KNOWN_HOSTS com a chave verificada da VPS"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar o build para a VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/deploy/storyverse/_incoming/"

      - name: Publicar (troca a versão e confere)
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /home/deploy/storyverse/deploy/publish.sh'
