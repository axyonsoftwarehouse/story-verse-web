name: Deploy Storyverse (VPS)

on:
  workflow_dispatch: {}
  push:
    branches: [vps]
    paths-ignore:
      - "story-magic-api/**"
      - ".github/workflows/story-magic-api.yml"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: deploy-storyverse
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar
        run: npm test

      - name: Montar o site (build)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # A VPS usa a API própria; nunca apontar uma publicação para loopback.
          VITE_API_URL: https://api.storyverse.2.29.42.104.sslip.io
          VITE_SUPABASE_EMAIL_OTP_ENABLED: ${{ secrets.VITE_SUPABASE_EMAIL_OTP_ENABLED }}
          VITE_LOGIN_REQUIRED: ${{ secrets.VITE_LOGIN_REQUIRED }}
        run: npm run build

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "Configure VPS_KNOWN_HOSTS com a chave verificada da VPS"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar o build para a VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/deploy/storyverse/_incoming/"

      - name: Publicar (troca a versão e confere)
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /home/deploy/storyverse/deploy/publish.sh'
