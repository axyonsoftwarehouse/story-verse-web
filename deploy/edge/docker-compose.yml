name: edge

services:
  caddy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FOODIE_DOMAIN: staging.2.29.42.104.sslip.io
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/deploy/storyverse/web:/srv/storyverse:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      - foodie
      - storyverse

networks:
  foodie:
    external: true
    name: foodie-staging_default
  storyverse:
    external: true
    name: storyverse_default

volumes:
  edge_data:
  edge_config:
