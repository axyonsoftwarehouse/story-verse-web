name: storyverse

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyverse}
      POSTGRES_USER: ${POSTGRES_USER:-storyverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - storyverse_db_data:/var/lib/postgresql/data
      # Aplica o schema no primeiro boot (só roda com o volume vazio).
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Cópia acessível para reaplicar depois (o script é idempotente):
      #   docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /schema.sql
      - ./schema.sql:/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - storyverse

  api:
    image: ${API_IMAGE:?defina uma imagem por commit ou digest}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-storyverse}
      SPRING_DATASOURCE_USERNAME: storyverse_api
      SPRING_DATASOURCE_PASSWORD: ${API_DB_PASSWORD:?defina API_DB_PASSWORD para storyverse_api}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-storyverse}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-storyverse}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://storyverse.2.29.42.104.sslip.io}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://storyverse.2.29.42.104.sslip.io}
      APP_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-https://api.storyverse.2.29.42.104.sslip.io}
      APP_COMMUNITY_COVER_HOSTS: ${APP_COMMUNITY_COVER_HOSTS:-covers.openlibrary.org,openlibrary.org,www.openlibrary.org,archive.org,www.archive.org}
      APP_AUTH_REQUIRE_EMAIL_CONFIRMATION: ${APP_AUTH_REQUIRE_EMAIL_CONFIRMATION:-true}
      APP_AUTH_CONFIRMATION_TTL: ${APP_AUTH_CONFIRMATION_TTL:-PT24H}
      APP_AUTH_RESET_TTL: ${APP_AUTH_RESET_TTL:-PT1H}
      APP_AUTH_REFRESH_COOKIE_SECURE: ${APP_AUTH_REFRESH_COOKIE_SECURE:-true}
      APP_AUTH_REFRESH_COOKIE_SAME_SITE: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:-Lax}
      APP_RATE_LIMIT_PERSISTENT: ${APP_RATE_LIMIT_PERSISTENT:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@storyverse.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Storyverse}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      STORAGE_DIR: /data/media
      # IA (chaves no SERVIDOR, nunca no navegador). Sem nenhuma, o chat fica em modo demonstração.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      # Assinatura (Stripe, modo real). Desligada por padrão: com BILLING_ENABLED=false a API
      # não cobra nem mostra paywall, mesmo com as chaves no .env.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      # A pasta precisa pertencer ao uid do app (10001). Em volume novo na VPS:
      #   docker run --rm -v storyverse_storyverse_media:/m alpine chown -R 10001:10001 /m
      - storyverse_media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - storyverse

networks:
  storyverse:
    external: true
    name: storyverse_default

volumes:
  storyverse_db_data:
  storyverse_media:
