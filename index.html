<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Guilherme Pinheiro" />
    <meta name="theme-color" content="#0c0a08" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Storyverse" />
    <title>Storyverse — leitura viva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #0c0a08;
      }
      .boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
      }
      .boot img {
        border-radius: 14px;
        box-shadow: 0 8px 30px -10px rgba(228, 184, 106, 0.5);
      }
      .boot-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(230, 200, 160, 0.14);
        border-top-color: #e4b86a;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Abrindo o Storyverse">
        <img src="/icons/icon.svg" width="56" height="56" alt="" />
        <span class="boot-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
